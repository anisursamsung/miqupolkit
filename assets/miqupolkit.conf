# miqupolkit Configuration

# Include global theme if desired (uncomment to source miquland theme)
# source = ~/.config/miquland/miquland.conf

[dialog]
# Dialog width in pixels
width = 440

# Dim the screen behind the modal authentication dialog (true / false)
dim_backdrop = false

# Close/cancel authentication dialog when clicking outside the window (true / false)
close_on_click_outside = false

# Show authenticating user identity badge (true / false)
show_user_identity = true

# Size of authentication header icon in pixels
icon_size = 32

[appearance]
# Corner rounding radius in pixels
# corner_radius = 14

# Border stroke width in pixels
# border_width = 1
